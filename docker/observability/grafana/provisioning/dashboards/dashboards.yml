apiVersion: 1

providers:
  - name: mechanical-matter
    orgId: 1
    folder: Mechanical Matter
    folderUid: mechanical-matter
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards/json
      foldersFromFilesStructure: false
